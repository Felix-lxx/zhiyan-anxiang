services:
  db:
    image: postgres:16-alpine
    container_name: zhiyan-anxiang-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zhiyan_anxiang}
      POSTGRES_USER: ${POSTGRES_USER:-zhiyan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zhiyan_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zhiyan}:${POSTGRES_PASSWORD:-zhiyan_local_only}@db:5432/${POSTGRES_DB:-zhiyan_anxiang}
      JWT_SECRET: ${JWT_SECRET:-replace-this-before-any-non-development-run}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Zhiyan@2026}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
